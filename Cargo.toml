[package]
name = "vicar"
version = "0.1.2"
edition = "2021"
authors = ["Kevin M. Gill <apoapsys@gmail.com>"]
description = "VICAR file format support"
license = "MIT" 

[lib]
name = "vicar"

[dependencies]
sciimg = {git = "https://github.com/MarsRaw/sciimg.git", branch = "main", features = ["rayon"]}
itertools = "0.14.0"
anyhow = "1.0.65"
regex = "1.7.0"
lazy_static = "1.4.0"

[patch.crates-io]
jpeg-decoder = { git = "https://github.com/MarsRaw/jpeg-decoder.git", branch = "optional-zero-ac63" }